name: tests

# Lint and the offline unit suite on every supported Python, then the sdist and
# wheel that go to PyPI, built from the source tree and checked with twine, so
# packaging mistakes (a misnamed readme, a missing package, a description PyPI
# can't render) fail here instead of in an upload or a deploy.
#
# Integration tests (live FastF1 downloads) are deliberately not run here.

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint
        run: |
          ruff check .
          black --check .

      - name: Unit tests (offline)
        run: pytest -m unit

      - name: Build the sdist and wheel PyPI gets, and check their metadata
        run: |
          pip install build twine
          python -m build
          twine check --strict dist/*

  core:
    # The charts are an optional extra: a plain install must work without Plotly.
    name: Core install (no extras)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install without extras
        run: |
          python -m pip install --upgrade pip
          pip install .

      - name: Every module imports, and Plotly is not installed
        run: |
          python -c "import lapbox.data, lapbox.pace, lapbox.practice, lapbox.telemetry, lapbox.tyres"
          python -c "import importlib.util as u; assert u.find_spec('plotly') is None, 'plotly installed'"
          python -c "
          try:
              import lapbox.plot
          except ImportError as exc:
              assert 'lapbox[plot]' in str(exc), exc
          else:
              raise SystemExit('lapbox.plot imported without Plotly')
          "
