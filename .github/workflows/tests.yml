name: tests

# Lint and the offline unit suite on every supported Python, then a wheel build
# from the source tree -- the same build the website's Docker image runs when it
# installs lapbox from a release tarball, so packaging mistakes (a misnamed
# readme, a missing package) fail here instead of in a deploy.
#
# Integration tests (live FastF1 downloads) are deliberately not run here.

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint
        run: |
          ruff check .
          black --check .

      - name: Unit tests (offline)
        run: pytest -m unit

      - name: Build a wheel from the source tree
        run: pip wheel --no-deps -w dist .
