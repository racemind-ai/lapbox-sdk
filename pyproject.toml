[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "lapbox"
dynamic = ["version"]
description = "Formula 1 analysis on top of FastF1 — and it says so when it can't."
readme = "Readme.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "LapBox" }]
keywords = ["formula1", "f1", "fastf1", "telemetry", "motorsport", "race-strategy"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering",
    "Typing :: Typed",
]
dependencies = [
    "fastf1>=3.4",
    "pandas>=2.1",
    "numpy>=1.26",
    "scipy>=1.11",  # find_peaks, corner-apex detection
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "ruff>=0.4", "black>=24.0"]

[project.urls]
Homepage = "https://github.com/racemind-ai/lapbox-sdk"
Issues = "https://github.com/racemind-ai/lapbox-sdk/issues"

[tool.setuptools.dynamic]
version = { attr = "lapbox.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
lapbox = ["py.typed"]

[tool.black]
line-length = 100
target-version = ["py311", "py312"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "C4", "SIM"]
ignore = [
    "E501",  # line length handled by black
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["N802", "N803"]  # allow non-PEP8 names in test fixtures/mocks

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = "-ra -q --strict-markers"
markers = [
    "unit: fast, isolated tests with no network or filesystem side effects",
    "integration: tests that hit the real FastF1 API / network (not run in CI)",
]
